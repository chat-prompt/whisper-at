name: Code Review Automation

on:
  pull_request_review_comment:
    types: [created, edited]

# 추가 권장사항
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze-and-fix:
    # PR 리뷰 코멘트에서만 실행
    if: github.event_name == 'pull_request_review_comment'
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    
    steps:
      - name: Check if comment is from reviewer
        id: check-comment
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            const author = comment.user.login;
            
            // CodeRabbit, Claude, 또는 리뷰어 코멘트인지 확인
            const isReviewComment = 
              author === 'coderabbitai' ||
              author.includes('claude') ||
              comment.author_association === 'COLLABORATOR' ||
              comment.author_association === 'MEMBER' ||
              comment.author_association === 'OWNER';
            
            core.setOutput('is-review-comment', isReviewComment);
            core.setOutput('comment-id', comment.id);
            core.setOutput('comment-body', comment.body);
            
            // PR 번호 가져오기 (pull_request_review_comment 이벤트)
            const prNumber = context.payload.pull_request.number;
            core.setOutput('pr-number', prNumber);


      - name: Analyze and fix with Claude
        if: steps.check-comment.outputs.is-review-comment == 'true'
        id: analyze-and-fix
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            다음 PR 리뷰 코멘트를 분석하고 필요시 코드 수정을 수행해주세요:
            
            코멘트: "${{ steps.check-comment.outputs.comment-body }}"
            
            1단계: 코멘트 분석
            이 코멘트가 코드 수정을 요청하는지 판단해주세요.
            - 코드 수정 요청: 구체적인 코드 변경, 버그 수정, 리팩토링, 기능 추가/변경 요청
            - 수정 불필요: 단순 질문, 긍정적 피드백, 코드와 무관한 코멘트, 문서 요청
            
            2단계: 코드 수정 (필요한 경우만)
            만약 코드 수정이 필요하다면:
            - 해당 파일과 코드 위치 찾기
            - 요청된 수정 사항 적용
            - 코드 스타일과 컨벤션 유지
            - 기존 기능을 손상시키지 않도록 주의
            
            응답 형식 (JSON):
            {
              "needs_code_change": true/false,
              "reason": "한 줄 설명",
              "suggested_action": "구체적인 수정 내용 요약"
            }
            
            [실제 코드 수정이 필요한 경우에만 파일 수정 수행]
          
          allowed_tools: "Read,Edit,MultiEdit,Grep,Glob"

      - name: Parse analysis result
        if: steps.check-comment.outputs.is-review-comment == 'true'
        id: parse-analysis
        uses: actions/github-script@v7
        with:
          script: |
            try {
              // Claude 분석 결과 파싱 (JSON 형식)
              const analysisOutput = `${{ steps.analyze-and-fix.outputs.response }}`;
              
              // JSON 부분 추출 (JSON이 응답에 포함되어 있을 수 있음)
              const jsonMatch = analysisOutput.match(/\{[\s\S]*\}/);
              
              let needsCodeChange = false;
              let reason = '';
              let suggestedAction = '';
              
              if (jsonMatch) {
                const jsonResult = JSON.parse(jsonMatch[0]);
                needsCodeChange = jsonResult.needs_code_change === true;
                reason = jsonResult.reason || '';
                suggestedAction = jsonResult.suggested_action || '';
              } else {
                // Fallback: 기존 텍스트 형식으로 파싱 시도
                const needsChangeMatch = analysisOutput.match(/NEEDS_CODE_CHANGE:\s*(true|false)/i);
                needsCodeChange = needsChangeMatch ? needsChangeMatch[1] === 'true' : false;
              }
              
              core.setOutput('needs-code-change', needsCodeChange);
              core.setOutput('reason', reason);
              core.setOutput('suggested-action', suggestedAction);
              
              console.log(`Analysis result - Needs code change: ${needsCodeChange}`);
              console.log(`Reason: ${reason}`);
              console.log(`Suggested action: ${suggestedAction}`);
              
            } catch (error) {
              console.error('Failed to parse Claude response:', error);
              core.setOutput('needs-code-change', false);
              core.setOutput('reason', 'Failed to parse response');
              core.setOutput('suggested-action', '');
            }

      - name: Get PR information
        if: steps.check-comment.outputs.is-review-comment == 'true' && steps.parse-analysis.outputs.needs-code-change == 'true'
        uses: actions/github-script@v7
        id: get-pr
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ steps.check-comment.outputs.pr-number }}
            });
            
            core.setOutput('pr-head-ref', pr.data.head.ref);
            core.setOutput('pr-base-ref', pr.data.base.ref);
            core.setOutput('pr-author', pr.data.user.login);

      - name: Checkout PR branch
        if: steps.check-comment.outputs.is-review-comment == 'true' && steps.parse-analysis.outputs.needs-code-change == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ steps.get-pr.outputs.pr-head-ref }}
          fetch-depth: 0

      - name: Create fix branch
        if: steps.check-comment.outputs.is-review-comment == 'true' && steps.parse-analysis.outputs.needs-code-change == 'true'
        id: create-branch
        run: |
          TIMESTAMP=$(date +%s)
          FIX_BRANCH="auto-fix-${{ steps.check-comment.outputs.pr-number }}-${TIMESTAMP}"
          git checkout -b $FIX_BRANCH
          echo "fix-branch=$FIX_BRANCH" >> $GITHUB_OUTPUT

      - name: Commit changes
        if: steps.check-comment.outputs.is-review-comment == 'true' && steps.parse-analysis.outputs.needs-code-change == 'true'
        id: commit-changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet; then
            git add -A
            git commit -m "Auto-fix: Apply review comment suggestions
            
            Addressing comment: ${{ steps.check-comment.outputs.comment-id }}
            From PR #${{ steps.check-comment.outputs.pr-number }}
            
            🤖 Generated with Claude Code Review Automation
            
            Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
            
            # Git push with retry and error handling
            MAX_RETRIES=3
            RETRY_COUNT=0
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if git push origin ${{ steps.create-branch.outputs.fix-branch }}; then
                echo "changes-committed=true" >> $GITHUB_OUTPUT
                echo "push-success=true" >> $GITHUB_OUTPUT
                break
              else
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "Push failed, attempt $RETRY_COUNT of $MAX_RETRIES"
                
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "Retrying in 5 seconds..."
                  sleep 5
                  
                  # 원격 브랜치 상태 확인 및 rebase 시도
                  git fetch origin
                  if git show-ref --verify --quiet refs/remotes/origin/${{ steps.create-branch.outputs.fix-branch }}; then
                    echo "Remote branch exists, attempting rebase..."
                    git rebase origin/${{ steps.create-branch.outputs.fix-branch }} || {
                      echo "Rebase failed, will create new branch"
                      TIMESTAMP=$(date +%s)
                      NEW_BRANCH="${{ steps.create-branch.outputs.fix-branch }}-retry-${TIMESTAMP}"
                      git checkout -b $NEW_BRANCH
                      echo "fix-branch=$NEW_BRANCH" >> $GITHUB_OUTPUT
                    }
                  fi
                else
                  echo "All push attempts failed"
                  echo "changes-committed=false" >> $GITHUB_OUTPUT
                  echo "push-success=false" >> $GITHUB_OUTPUT
                  echo "push-error=Max retries exceeded" >> $GITHUB_OUTPUT
                fi
              fi
            done
          else
            echo "No changes detected"
            echo "changes-committed=false" >> $GITHUB_OUTPUT
            echo "push-success=false" >> $GITHUB_OUTPUT
          fi

      - name: Create approval PR
        if: steps.commit-changes.outputs.changes-committed == 'true' && steps.commit-changes.outputs.push-success == 'true'
        uses: actions/github-script@v7
        id: create-pr
        with:
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto-fix] Apply review suggestions from PR #${{ steps.check-comment.outputs.pr-number }}`,
              head: '${{ steps.create-branch.outputs.fix-branch }}',
              base: '${{ steps.get-pr.outputs.pr-head-ref }}',
              body: `## 자동 코드 수정
              
              이 PR은 리뷰 코멘트에 따라 자동으로 생성되었습니다.
              
              ### 원본 코멘트
              ${context.payload.comment.html_url}
              
              ### 코멘트 내용
              > ${{ steps.check-comment.outputs.comment-body }}
              
              ### 수정 사항
              Claude AI가 위 코멘트를 분석하여 자동으로 수정했습니다.
              
              ### 다음 단계
              1. 변경 사항을 검토해주세요
              2. 올바르게 수정되었다면 이 PR을 승인해주세요
              3. 승인 후 자동으로 원본 PR에 머지되고 코멘트가 resolve됩니다
              
              cc @${{ steps.get-pr.outputs.pr-author }}`,
              draft: false
            });
            
            core.setOutput('approval-pr-number', pr.data.number);
            core.setOutput('approval-pr-url', pr.data.html_url);

      - name: Add comment to original PR
        if: steps.commit-changes.outputs.changes-committed == 'true' && steps.commit-changes.outputs.push-success == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.check-comment.outputs.pr-number }},
              body: `🤖 자동 수정이 생성되었습니다!
              
              리뷰 코멘트에 따른 수정 사항이 자동으로 적용되었습니다.
              승인을 위한 PR: ${{ steps.create-pr.outputs.approval-pr-url }}
              
              PR 작성자(@${{ steps.get-pr.outputs.pr-author }})님, 변경 사항을 검토하고 승인해주세요.`
            });

      - name: Handle push failure
        if: steps.commit-changes.outputs.changes-committed == 'false' && steps.commit-changes.outputs.push-success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const errorMessage = `${{ steps.commit-changes.outputs.push-error }}` || 'Unknown error';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.check-comment.outputs.pr-number }},
              body: `⚠️ 자동 수정 실패
              
              리뷰 코멘트에 따른 코드 수정을 시도했지만 실패했습니다.
              
              **오류 원인:** ${errorMessage}
              
              다음 방법을 시도해보세요:
              1. 수동으로 코드를 수정해주세요
              2. 브랜치 충돌이 있는지 확인해주세요
              3. 잠시 후 다시 시도해주세요
              
              cc @${{ steps.get-pr.outputs.pr-author }}`
            });

  # 승인 PR이 머지되면 원본 PR에 알림
  handle-approval:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && contains(github.event.pull_request.title, '[Auto-fix]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Extract original PR number
        id: extract-pr
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_NUMBER=$(echo $PR_TITLE | grep -oP '#\K\d+')
          echo "original-pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Add completion comment to original PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.extract-pr.outputs.original-pr-number }},
              body: `✅ 자동 수정이 승인되고 적용되었습니다!
              
              코드 리뷰 자동화에 의해 처리된 수정 사항이 성공적으로 머지되었습니다.`
            });