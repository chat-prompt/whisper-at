name: Code Review Analysis

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: string
      comment_body:
        description: 'Comment body'
        required: true
        type: string
      comment_id:
        description: 'Comment ID'
        required: true
        type: string
      pr_head_ref:
        description: 'PR head ref'
        required: true
        type: string
      pr_base_ref:
        description: 'PR base ref'
        required: true
        type: string

jobs:
  analyze-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      
    steps:
      - name: Analyze comment intelligently
        id: analyze-comment
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = ${{ toJSON(github.event.inputs.comment_body) }};
            
            // 스마트한 분석 - 코멘트의 의도와 톤 분석
            const analysisRules = [
              // 명확한 수정 요청 패턴
              { pattern: /suggestion|recommend|should|must|need to|fix|refactor|improve/i, weight: 3 },
              { pattern: /잘못|오류|문제|수정|변경|개선|권장|제안/g, weight: 3 },
              
              // 코드 관련 키워드
              { pattern: /\bcode\b|function|method|class|variable|파일|스크립트/gi, weight: 2 },
              
              // 부정적 톤 (문제 지적)
              { pattern: /wrong|incorrect|bad|issue|problem|error|fail/i, weight: 2 },
              
              // 구체적 행동 동사
              { pattern: /add|remove|change|update|replace|move|delete|create/i, weight: 2 },
              
              // 단순 질문이나 긍정적 피드백 (점수 감소)
              { pattern: /\?|question|why|how|good|great|nice|looks good/i, weight: -1 },
              { pattern: /\?|질문|왜|어떻게|좋|훌륭|멋진/g, weight: -1 }
            ];
            
            let score = 0;
            let matchedPatterns = [];
            
            // 각 규칙 적용
            analysisRules.forEach(rule => {
              const matches = commentBody.match(rule.pattern);
              if (matches) {
                const matchCount = matches.length;
                score += rule.weight * matchCount;
                matchedPatterns.push(`${rule.pattern.toString()}: ${matchCount}회 (점수: ${rule.weight * matchCount})`);
              }
            });
            
            // 코드 블록이나 diff가 있으면 수정 제안 가능성 높음
            if (commentBody.includes('```') || commentBody.includes('diff')) {
              score += 3;
              matchedPatterns.push('코드 블록/diff 발견: +3점');
            }
            
            // 최종 판단 (임계값: 2점)
            const needsCodeChange = score >= 2;
            
            let reason, suggestedAction;
            if (needsCodeChange) {
              reason = `코드 수정 제안 (분석 점수: ${score}점)`;
              suggestedAction = '리뷰 코멘트에 따른 코드 개선';
            } else {
              reason = `단순 질문 또는 정보성 코멘트 (분석 점수: ${score}점)`;
              suggestedAction = '수정 불필요';
            }
            
            console.log('=== 코멘트 분석 결과 ===');
            console.log(`원문: ${commentBody.substring(0, 100)}...`);
            console.log(`매칭된 패턴들:`);
            matchedPatterns.forEach(pattern => console.log(`  - ${pattern}`));
            console.log(`최종 점수: ${score}점`);
            console.log(`수정 필요: ${needsCodeChange}`);
            console.log(`이유: ${reason}`);
            
            core.setOutput('needs-code-change', needsCodeChange);
            core.setOutput('reason', reason);
            core.setOutput('suggested-action', suggestedAction);
            
      - name: Apply code changes with Claude Code
        if: steps.analyze-comment.outputs.needs-code-change == 'true'
        uses: anthropics/claude-code-action@beta
        id: claude-fix
        with:
          github_token: ${{ secrets.CLAUDE_PAT }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            다음 PR 리뷰 코멘트에 따라 코드를 수정해주세요:
            
            리뷰 코멘트: ${{ toJSON(github.event.inputs.comment_body) }}
            
            위 코멘트를 분석하여:
            1. 해당하는 파일을 찾아주세요
            2. 코멘트에서 지적한 문제점을 파악해주세요  
            3. 적절한 수정을 적용해주세요
            4. 기존 코드 스타일과 컨벤션을 유지해주세요
            
            수정이 완료되면 변경 사항을 요약해주세요.
          allowed_tools: "Read,Edit,MultiEdit,Grep,Glob"
          mode: "direct"
        continue-on-error: true
        
      - name: Check if changes were made
        id: check-changes
        run: |
          # Claude가 실제로 파일을 수정했는지 확인
          if git diff --quiet; then
            echo "code-modified=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "code-modified=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git diff --name-only
          fi
          
      - name: Set analysis result
        id: parse-analysis
        run: |
          echo "needs-code-change=${{ steps.analyze-comment.outputs.needs-code-change }}" >> $GITHUB_OUTPUT
          echo "reason=${{ steps.analyze-comment.outputs.reason }}" >> $GITHUB_OUTPUT
          echo "suggested-action=${{ steps.analyze-comment.outputs.suggested-action }}" >> $GITHUB_OUTPUT
            
      - name: Checkout PR branch
        if: steps.parse-analysis.outputs.needs-code-change == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLAUDE_PAT }}
          ref: ${{ github.event.inputs.pr_head_ref }}
          fetch-depth: 0
          
      - name: Create fix branch
        if: steps.parse-analysis.outputs.needs-code-change == 'true'
        id: create-branch
        run: |
          TIMESTAMP=$(date +%s)
          FIX_BRANCH="auto-fix-${{ github.event.inputs.pr_number }}-${TIMESTAMP}"
          git checkout -b $FIX_BRANCH
          echo "fix-branch=$FIX_BRANCH" >> $GITHUB_OUTPUT
          
      - name: Commit changes
        if: steps.check-changes.outputs.code-modified == 'true'
        id: commit-changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git commit -m "Auto-fix: Apply review comment suggestions
          
          Addressing comment: ${{ github.event.inputs.comment_id }}
          From PR #${{ github.event.inputs.pr_number }}
          
          🤖 Generated with Claude Code Review Automation
          
          Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
          
          git push origin ${{ steps.create-branch.outputs.fix-branch }}
          echo "changes-committed=true" >> $GITHUB_OUTPUT
          
      - name: Create approval PR
        if: steps.commit-changes.outputs.changes-committed == 'true'
        uses: actions/github-script@v7
        id: create-pr
        with:
          github-token: ${{ secrets.CLAUDE_PAT }}
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto-fix] Apply review suggestions from PR #${{ github.event.inputs.pr_number }}`,
              head: '${{ steps.create-branch.outputs.fix-branch }}',
              base: '${{ github.event.inputs.pr_head_ref }}',
              body: `## 자동 코드 수정
              
              이 PR은 리뷰 코멘트에 따라 자동으로 생성되었습니다.
              
              ### 코멘트 내용
              > ${{ toJSON(github.event.inputs.comment_body) }}
              
              ### 수정 사항
              Claude AI가 위 코멘트를 분석하여 자동으로 수정했습니다.
              
              ### 다음 단계
              1. 변경 사항을 검토해주세요
              2. 올바르게 수정되었다면 이 PR을 승인해주세요
              3. 승인 후 자동으로 원본 PR에 머지됩니다`,
              draft: false
            });
            
            core.setOutput('approval-pr-number', pr.data.number);
            core.setOutput('approval-pr-url', pr.data.html_url);
            
      - name: Add comment to original PR
        if: steps.commit-changes.outputs.changes-committed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CLAUDE_PAT }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.pr_number }},
              body: `🤖 자동 수정이 생성되었습니다!
              
              리뷰 코멘트에 따른 수정 사항이 자동으로 적용되었습니다.
              승인을 위한 PR: ${{ steps.create-pr.outputs.approval-pr-url }}
              
              변경 사항을 검토하고 승인해주세요.`
            });