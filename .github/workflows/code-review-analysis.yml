name: Code Review Analysis

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: string
      comment_body:
        description: 'Comment body'
        required: true
        type: string
      comment_id:
        description: 'Comment ID'
        required: true
        type: string
      pr_head_ref:
        description: 'PR head ref'
        required: true
        type: string
      pr_base_ref:
        description: 'PR base ref'
        required: true
        type: string

jobs:
  analyze-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      
    steps:
      - name: Analyze comment with Claude API
        id: analyze-comment
        run: |
          COMMENT_BODY='${{ github.event.inputs.comment_body }}'
          
          # Claude API를 직접 호출하여 코멘트 분석
          RESPONSE=$(curl -s -X POST https://api.anthropic.com/v1/messages \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.CLAUDE_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -d "{
              \"model\": \"claude-3-sonnet-20240229\",
              \"max_tokens\": 1000,
              \"messages\": [{
                \"role\": \"user\",
                \"content\": \"다음 PR 리뷰 코멘트를 분석하고 코드 수정이 필요한지 판단해주세요. JSON 형식으로만 응답해주세요.\\n\\n코멘트: $COMMENT_BODY\\n\\n응답 형식:\\n{\\\"needs_code_change\\\": true/false, \\\"reason\\\": \\\"한 줄 설명\\\", \\\"suggested_action\\\": \\\"구체적인 수정 내용\\\"}\"
              }]
            }")
          
          echo "Claude API Response: $RESPONSE"
          
          # JSON 응답에서 값 추출
          NEEDS_CHANGE=$(echo "$RESPONSE" | jq -r '.content[0].text' | jq -r '.needs_code_change // false')
          REASON=$(echo "$RESPONSE" | jq -r '.content[0].text' | jq -r '.reason // "분석 실패"')
          ACTION=$(echo "$RESPONSE" | jq -r '.content[0].text' | jq -r '.suggested_action // "없음"')
          
          echo "needs-code-change=$NEEDS_CHANGE" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          echo "suggested-action=$ACTION" >> $GITHUB_OUTPUT
          
          echo "Analysis result: $NEEDS_CHANGE"
          echo "Reason: $REASON"
            
      - name: Apply code changes with Claude
        if: steps.analyze-comment.outputs.needs-code-change == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // 여기서는 단순히 코드 변경이 필요하다고 표시만 함
            // 실제 Claude 기반 코드 수정은 향후 구현
            console.log('Code changes needed based on review comment');
            console.log('Comment: ${{ github.event.inputs.comment_body }}');
            
            // TODO: Claude API를 직접 호출하여 코드 수정 구현
            // 현재는 수동 수정이 필요한 상태로 표시
          
      - name: Set analysis result
        id: parse-analysis
        run: |
          echo "needs-code-change=${{ steps.analyze-comment.outputs.needs-code-change }}" >> $GITHUB_OUTPUT
          echo "reason=${{ steps.analyze-comment.outputs.reason }}" >> $GITHUB_OUTPUT
          echo "suggested-action=${{ steps.analyze-comment.outputs.suggested-action }}" >> $GITHUB_OUTPUT
            
      - name: Checkout PR branch
        if: steps.parse-analysis.outputs.needs-code-change == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLAUDE_PAT }}
          ref: ${{ github.event.inputs.pr_head_ref }}
          fetch-depth: 0
          
      - name: Create fix branch
        if: steps.parse-analysis.outputs.needs-code-change == 'true'
        id: create-branch
        run: |
          TIMESTAMP=$(date +%s)
          FIX_BRANCH="auto-fix-${{ github.event.inputs.pr_number }}-${TIMESTAMP}"
          git checkout -b $FIX_BRANCH
          echo "fix-branch=$FIX_BRANCH" >> $GITHUB_OUTPUT
          
      - name: Commit changes
        if: steps.parse-analysis.outputs.needs-code-change == 'true'
        id: commit-changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet; then
            git add -A
            git commit -m "Auto-fix: Apply review comment suggestions
            
            Addressing comment: ${{ github.event.inputs.comment_id }}
            From PR #${{ github.event.inputs.pr_number }}
            
            🤖 Generated with Claude Code Review Automation
            
            Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
            
            git push origin ${{ steps.create-branch.outputs.fix-branch }}
            echo "changes-committed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected"
            echo "changes-committed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Create approval PR
        if: steps.commit-changes.outputs.changes-committed == 'true'
        uses: actions/github-script@v7
        id: create-pr
        with:
          github-token: ${{ secrets.CLAUDE_PAT }}
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto-fix] Apply review suggestions from PR #${{ github.event.inputs.pr_number }}`,
              head: '${{ steps.create-branch.outputs.fix-branch }}',
              base: '${{ github.event.inputs.pr_head_ref }}',
              body: `## 자동 코드 수정
              
              이 PR은 리뷰 코멘트에 따라 자동으로 생성되었습니다.
              
              ### 코멘트 내용
              > ${{ github.event.inputs.comment_body }}
              
              ### 수정 사항
              Claude AI가 위 코멘트를 분석하여 자동으로 수정했습니다.
              
              ### 다음 단계
              1. 변경 사항을 검토해주세요
              2. 올바르게 수정되었다면 이 PR을 승인해주세요
              3. 승인 후 자동으로 원본 PR에 머지됩니다`,
              draft: false
            });
            
            core.setOutput('approval-pr-number', pr.data.number);
            core.setOutput('approval-pr-url', pr.data.html_url);
            
      - name: Add comment to original PR
        if: steps.commit-changes.outputs.changes-committed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CLAUDE_PAT }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.pr_number }},
              body: `🤖 자동 수정이 생성되었습니다!
              
              리뷰 코멘트에 따른 수정 사항이 자동으로 적용되었습니다.
              승인을 위한 PR: ${{ steps.create-pr.outputs.approval-pr-url }}
              
              변경 사항을 검토하고 승인해주세요.`
            });