name: Code Review Analysis

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number'
        required: true
        type: string
      comment_body:
        description: 'Comment body'
        required: true
        type: string
      comment_id:
        description: 'Comment ID'
        required: true
        type: string
      pr_head_ref:
        description: 'PR head ref'
        required: true
        type: string
      pr_base_ref:
        description: 'PR base ref'
        required: true
        type: string

jobs:
  analyze-and-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      
    steps:
      - name: Analyze and fix with Claude
        id: analyze-and-fix
        uses: anthropics/claude-code-action@beta
        with:
          github_token: ${{ secrets.CLAUDE_PAT }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          direct_prompt: |
            다음 PR 리뷰 코멘트를 분석하고 필요시 코드 수정을 수행해주세요:
            
            코멘트: "${{ github.event.inputs.comment_body }}"
            
            1단계: 코멘트 분석
            이 코멘트가 코드 수정을 요청하는지 판단해주세요.
            - 코드 수정 요청: 구체적인 코드 변경, 버그 수정, 리팩토링, 기능 추가/변경 요청
            - 수정 불필요: 단순 질문, 긍정적 피드백, 코드와 무관한 코멘트, 문서 요청
            
            2단계: 코드 수정 (필요한 경우만)
            만약 코드 수정이 필요하다면:
            - 해당 파일과 코드 위치 찾기
            - 요청된 수정 사항 적용
            - 코드 스타일과 컨벤션 유지
            - 기존 기능을 손상시키지 않도록 주의
            
            응답 형식 (JSON):
            {
              "needs_code_change": true/false,
              "reason": "한 줄 설명",
              "suggested_action": "구체적인 수정 내용 요약"
            }
            
            [실제 코드 수정이 필요한 경우에만 파일 수정 수행]
          
          allowed_tools: "Read,Edit,MultiEdit,Grep,Glob"
          
      - name: Parse analysis result
        id: parse-analysis
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const analysisOutput = `${{ steps.analyze-and-fix.outputs.response }}`;
              const jsonMatch = analysisOutput.match(/\{[\s\S]*\}/);
              
              let needsCodeChange = false;
              let reason = '';
              let suggestedAction = '';
              
              if (jsonMatch) {
                const jsonResult = JSON.parse(jsonMatch[0]);
                needsCodeChange = jsonResult.needs_code_change === true;
                reason = jsonResult.reason || '';
                suggestedAction = jsonResult.suggested_action || '';
              }
              
              core.setOutput('needs-code-change', needsCodeChange);
              core.setOutput('reason', reason);
              core.setOutput('suggested-action', suggestedAction);
              
              console.log(`Analysis result - Needs code change: ${needsCodeChange}`);
              console.log(`Reason: ${reason}`);
              
            } catch (error) {
              console.error('Failed to parse Claude response:', error);
              core.setOutput('needs-code-change', false);
            }
            
      - name: Checkout PR branch
        if: steps.parse-analysis.outputs.needs-code-change == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.CLAUDE_PAT }}
          ref: ${{ github.event.inputs.pr_head_ref }}
          fetch-depth: 0
          
      - name: Create fix branch
        if: steps.parse-analysis.outputs.needs-code-change == 'true'
        id: create-branch
        run: |
          TIMESTAMP=$(date +%s)
          FIX_BRANCH="auto-fix-${{ github.event.inputs.pr_number }}-${TIMESTAMP}"
          git checkout -b $FIX_BRANCH
          echo "fix-branch=$FIX_BRANCH" >> $GITHUB_OUTPUT
          
      - name: Commit changes
        if: steps.parse-analysis.outputs.needs-code-change == 'true'
        id: commit-changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git diff --quiet; then
            git add -A
            git commit -m "Auto-fix: Apply review comment suggestions
            
            Addressing comment: ${{ github.event.inputs.comment_id }}
            From PR #${{ github.event.inputs.pr_number }}
            
            🤖 Generated with Claude Code Review Automation
            
            Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
            
            git push origin ${{ steps.create-branch.outputs.fix-branch }}
            echo "changes-committed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected"
            echo "changes-committed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Create approval PR
        if: steps.commit-changes.outputs.changes-committed == 'true'
        uses: actions/github-script@v7
        id: create-pr
        with:
          github-token: ${{ secrets.CLAUDE_PAT }}
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Auto-fix] Apply review suggestions from PR #${{ github.event.inputs.pr_number }}`,
              head: '${{ steps.create-branch.outputs.fix-branch }}',
              base: '${{ github.event.inputs.pr_head_ref }}',
              body: `## 자동 코드 수정
              
              이 PR은 리뷰 코멘트에 따라 자동으로 생성되었습니다.
              
              ### 코멘트 내용
              > ${{ github.event.inputs.comment_body }}
              
              ### 수정 사항
              Claude AI가 위 코멘트를 분석하여 자동으로 수정했습니다.
              
              ### 다음 단계
              1. 변경 사항을 검토해주세요
              2. 올바르게 수정되었다면 이 PR을 승인해주세요
              3. 승인 후 자동으로 원본 PR에 머지됩니다`,
              draft: false
            });
            
            core.setOutput('approval-pr-number', pr.data.number);
            core.setOutput('approval-pr-url', pr.data.html_url);
            
      - name: Add comment to original PR
        if: steps.commit-changes.outputs.changes-committed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CLAUDE_PAT }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.pr_number }},
              body: `🤖 자동 수정이 생성되었습니다!
              
              리뷰 코멘트에 따른 수정 사항이 자동으로 적용되었습니다.
              승인을 위한 PR: ${{ steps.create-pr.outputs.approval-pr-url }}
              
              변경 사항을 검토하고 승인해주세요.`
            });