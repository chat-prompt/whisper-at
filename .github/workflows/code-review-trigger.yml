name: Code Review Trigger

on:
  pull_request_review_comment:
    types: [created, edited]

jobs:
  trigger-analysis:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      
    steps:
      - name: Check if comment is from reviewer
        id: check-comment
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment;
            const author = comment.user.login;
            const isBot = comment.user.type === 'Bot';
            
            // CodeRabbit, Claude, 또는 리뷰어 코멘트인지 확인
            const isReviewComment = 
              author === 'coderabbitai' ||
              author.includes('coderabbit') ||
              author.includes('claude') ||
              (isBot && author.includes('coderabbit')) ||
              comment.author_association === 'COLLABORATOR' ||
              comment.author_association === 'MEMBER' ||
              comment.author_association === 'OWNER';
            
            if (!isReviewComment) {
              console.log('Not a review comment, skipping');
              return;
            }
            
            core.setOutput('should-trigger', 'true');
            
      - name: Trigger analysis workflow
        if: steps.check-comment.outputs.should-trigger == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CLAUDE_PAT }}
          script: |
            const comment = context.payload.comment;
            const pr = context.payload.pull_request;
            
            // Workflow dispatch를 트리거
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'code-review-analysis.yml',
              ref: pr.base.ref,
              inputs: {
                pr_number: String(pr.number),
                comment_body: comment.body,
                comment_id: String(comment.id),
                pr_head_ref: pr.head.ref,
                pr_base_ref: pr.base.ref
              }
            });
            
            console.log('Triggered code review analysis workflow');